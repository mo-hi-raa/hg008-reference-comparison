# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "hg008-reference-comparison"
description = "Compares how GRCh38, T2T-CHM13, a pangenome graph and the donor's own genome affect somatic variant calling in the HG008 tumour-normal pair, using short and long reads"
authors = ["Mohiraa Shafreen M <mohiraa.shafreen@mbzuai.ac.ae>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
quarto = ">=1.9"
jupyterlab = ">=4"
ipykernel = ">=7"
pandas = ">=2"
matplotlib = ">=3.9"
papermill = ">=2.6"   # Quarto needs it for report parameters (-P)

[tasks]
check = { cmd = "python --version && quarto --version", description = "Check that the tools work" }
download = { cmd = "bash scripts/s01_download.sh", description = "Download the raw data listed in metadata/sources.tsv" }

[feature.pipeline]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[feature.pipeline.dependencies]
bwa = ">=0.7.19,<0.8"
samtools = ">=1.25,<2"
gatk4 = ">=4.6.2.0,<5"
rtg-tools = ">=3.13,<4"
aardvark = ">=1.1.0,<2"

[feature.pipeline.target.linux-64.dependencies]
vg = ">=1.70,<1.73"
minimap2 = ">=2.31,<3"
k8 = ">=1.2,<2"

[environments]
pipeline = ["pipeline"]
capstone = ["capstone"]

[feature.capstone]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[feature.capstone.dependencies]
bwa = ">=0.7.19,<0.8"
samtools = ">=1.25,<2"
gatk4 = ">=4.6.2.0,<5"
snakemake = ">=9.24.0,<10"
pyyaml = ">=6.0.3,<7"

[feature.capstone.tasks]
reproduce = { cmd = "snakemake --cores 4", description = "CBIO 7501 capstone: fetch the chr22 test data from NIST, align, call, compare, render the report" }
